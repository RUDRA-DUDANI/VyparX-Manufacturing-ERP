<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>VyaparX ERP – Purchase & Trading</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/erp.css?v=20261101-modal-layout" />
    <link rel="stylesheet" href="../css/purchese.css" />
  </head>
  <body>
    <aside id="sb"></aside>
    <header>
      <button class="ic" id="mb" aria-label="Menu">☰</button
      ><button class="ic" id="ct" aria-label="Collapse sidebar">⇆</button>
      <div>
        <h1 id="pt"></h1>
        <div class="bc" id="bc"></div>
      </div>
      <input
        class="in srch"
        id="gs"
        placeholder="Search purchase orders, press Enter"
        aria-label="Search purchase orders"
      />
      <button class="ic" id="bell" aria-label="Notifications" title="Notifications">
        <i class="fa-solid fa-bell"></i><span class="dot" id="nc"></span>
      </button>
      <button class="ic" id="th" aria-label="Toggle theme">
        ◐
      </button>
      <button
        class="ic pf"
        id="pbtn"
        aria-label="Open profile"
        data-act="pview"
      >
        <span class="av" id="pav"></span
        ><span style="line-height: 1.2; text-align: left"
          ><b style="font-weight: 500" id="pnm"></b
          ><span class="bc" style="display: block" id="prl"></span
        ></span>
      </button>
    </header>
    <main id="mn"></main>
    <div id="toast"></div>
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/erp-shared.js"></script>
    <script src="../javascript/guard.js"></script>
    <script src="../javascript/custom-fields.js"></script>
    <script src="../javascript/purchese.js"></script>
  </body>
</html>
